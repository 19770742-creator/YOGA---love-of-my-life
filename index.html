<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Yoga ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #ff4d6d, #c9184a);
    color: white;
    overflow-x: hidden;
}

/* Title */
h1 {
    margin-top: 40px;
    font-size: 45px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px yellow; }
}

/* Photos */
.gallery img {
    width: 200px;
    height: 260px;
    object-fit: cover;
    margin: 10px;
    border-radius: 20px;
    box-shadow: 0 0 15px white;
}

/* Buttons */
button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    margin: 15px;
    cursor: pointer;
}

.yes {
    background: white;
    color: #c9184a;
}

.no {
    background: black;
    color: white;
    position: relative;
}

/* Gifts */
.gift-box {
    display: inline-block;
    padding: 15px;
    margin: 10px;
    background: gold;
    color: black;
    border-radius: 15px;
    cursor: pointer;
}

.surprise {
    display: none;
    margin-top: 15px;
    font-size: 20px;
}

/* Signature */
.signature {
    margin-top: 40px;
    font-size: 22px;
    font-family: cursive;
}

/* Fireworks */
.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    background: yellow;
    border-radius: 50%;
    animation: explode 1s ease-out;
}

@keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(15); opacity: 0; }
}
</style>
</head>

<body>

<h1>Yoga ❤️ Will You Be My Valentine?</h1>

<div class="gallery">
    <img src="photo1.jpg.jpeg">
    <img src="photo2.jpg.jpeg">
    <img src="photo3.jpg.jpeg">
    <img src="photo4.jpg.jpeg">
    <img src="photo5.jpg.jpeg">
    <img src="photo6.jpg.jpeg">
</div>

<br>

<button class="yes" onclick="sayYes()">YES ❤️</button>
<button class="no" onmouseover="moveNo(this)">NO 😜</button>

<div id="answer" style="font-size:25px; margin-top:20px;"></div>

<!-- Gifts -->
<h2>Open Your Gifts 🎁</h2>

<div class="gift-box" onclick="openGift(1)">🎁 Gift 1</div>
<div class="gift-box" onclick="openGift(2)">🎁 Gift 2</div>
<div class="gift-box" onclick="openGift(3)">🎁 Gift 3</div>

<div id="surprise1" class="surprise">You are my forever ❤️</div>
<div id="surprise2" class="surprise"><img src="photo1.jpg.jpeg" width="200"></div>
<div id="surprise3" class="surprise">One day I will marry you 💍</div>

<div class="signature">With Love, Sathish ❤️</div>

<audio id="music" src="perfect.mp3.mpeg"></audio>

<script>

function sayYes() {
    document.getElementById("answer").innerHTML = "YAYYY ❤️ I Love You So Much!";
    document.getElementById("music").play();
    createFireworks();
}

function moveNo(button) {
    button.style.position = "absolute";
    button.style.left = Math.random() * window.innerWidth + "px";
    button.style.top = Math.random() * window.innerHeight + "px";
}

function openGift(num) {
    document.getElementById("surprise1").style.display = "none";
    document.getElementById("surprise2").style.display = "none";
    document.getElementById("surprise3").style.display = "none";
    document.getElementById("surprise" + num).style.display = "block";
}

function createFireworks() {
    for (let i = 0; i < 25; i++) {
        let firework = document.createElement("div");
        firework.className = "firework";
        firework.style.left = Math.random() * window.innerWidth + "px";
        firework.style.top = Math.random() * window.innerHeight + "px";
        document.body.appendChild(firework);

        setTimeout(() => {
            firework.remove();
        }, 1000);
    }
}

</script>

</body>
</html>
