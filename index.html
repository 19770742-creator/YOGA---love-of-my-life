<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    overflow:hidden;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
}

/* Slide Style */
.slide{
    position:absolute;
    top:0;
    left:100%;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
    transition:left 0.8s ease;
}

.slide.active{
    left:0;
}

h1,h2,p{
    color:white;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff4e7a;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>

<body>

<!-- Slide 1 -->
<div class="slide active" id="slide1">
    <h1>Hi My Love ❤️</h1>
    <p>I made this special for you</p>
    <button onclick="showSlide('slide2')">Next ➡</button>
</div>

<!-- Slide 2 -->
<div class="slide" id="slide2">
    <h2>You are my happiness 🌸</h2>
    <p>Every moment with you is magical</p>
    <button onclick="showSlide('slide3')">Next ➡</button>
</div>

<!-- Slide 3 -->
<div class="slide" id="slide3">
    <h2>I Love You Forever 💕</h2>
    <p>You mean everything to me</p>
</div>

<!-- Music -->
<audio id="music" src="perfect.mp3.mpeg" preload="auto"></audio>

<script>
/* Slide Function */
function showSlide(id){
    document.querySelectorAll(".slide").forEach(slide=>{
        slide.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

/* Auto Play Music on First Tap */
document.addEventListener("click",function(){
    const music=document.getElementById("music");
    music.play().catch(()=>{});
},{once:true});
</script>

</body>
</html>
