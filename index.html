<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Yoga ❤️</title>
<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #ff4d6d, #c9184a);
    color: white;
    overflow-x: hidden;
}

h1 {
    margin-top: 40px;
    font-size: 38px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px yellow; }
}

.gallery img {
    width: 180px;
    height: 240px;
    object-fit: cover;
    margin: 8px;
    border-radius: 20px;
    box-shadow: 0 0 15px white;
}

button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    margin: 10px;
    cursor: pointer;
}

.yes {
    background: white;
    color: #c9184a;
}

.no {
    background: black;
    color: white;
    position: relative;
}

.gift-box {
    display: inline-block;
    padding: 15px;
    margin: 10px;
    background: gold;
    color: black;
    border-radius: 15px;
    cursor: pointer;
}

.animated-gift, .letter, .proposal-overlay {
    display: none;
}

/* Rose Gift */
.real-rose {
    width: 200px;
    animation: rosePop 1.5s ease forwards;
}

@keyframes rosePop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.love-quote {
    font-size: 18px;
    margin-top: 10px;
    opacity: 0;
}

.q1 { animation: fadeIn 2s forwards; animation-delay: 1s; }
.q2 { animation: fadeIn 2s forwards; animation-delay: 3s; }
.q3 { animation: fadeIn 2s forwards; animation-delay: 5s; }
.q4 { animation: fadeIn 2s forwards; animation-delay: 7s; }

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Letter */
.letter {
    margin: 30px auto;
    width: 80%;
    max-width: 500px;
    background: #fff0f3;
    color: #c9184a;
    padding: 20px;
    border-radius: 15px;
    font-size: 16px;
    text-align: left;
    box-shadow: 0 0 20px white;
}

/* Proposal */
.proposal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

.proposal-box {
    background: #ff4d6d;
    padding: 40px;
    border-radius: 20px;
    animation: zoomIn 1s ease forwards;
}

@keyframes zoomIn {
    from { transform: scale(0); }
    to { transform: scale(1); }
}

/* Fireworks */
.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    background: yellow;
    border-radius: 50%;
    animation: explode 1s ease-out;
}

@keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(15); opacity: 0; }
}

/* Hearts */
.heart {
    position: fixed;
    font-size: 20px;
    animation: floatUp 4s linear;
    color: pink;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-600px); opacity: 0; }
}

</style>
</head>

<body>

<h1>Yoga ❤️ Will You Be My Valentine?</h1>

<div class="gallery">
<img src="photo1.jpg.jpeg">
<img src="photo2.jpg.jpeg">
<img src="photo3.jpg.jpeg">
<img src="photo4.jpg.jpeg">
<img src="photo5.jpg.jpeg">
<img src="photo6.jpg.jpeg">
</div>

<button class="yes" onclick="sayYes()">YES ❤️</button>
<button class="no" onmouseover="moveNo(this)">NO 😜</button>

<h2>Open Your Gifts 🎁</h2>

<div class="gift-box" onclick="openRose()">🌹 Gift 1</div>
<div class="gift-box" onclick="openLetter()">💌 Gift 2</div>
<div class="gift-box" onclick="openProposal()">💍 Gift 3</div>

<div id="roseGift" class="animated-gift">
<img src="rose.png" class="rose-img">
<div class="love-quote q1">You are the reason my heart smiles ❤️</div>
<div class="love-quote q2">Every moment with you feels magical ✨</div>
<div class="love-quote q3">I found my forever in you 💞</div>
<div class="love-quote q4">You are my today and all my tomorrows 🌹</div>
</div>

<div id="loveLetter" class="letter">
<p id="typedText"></p>
</div>

<div id="proposalOverlay" class="proposal-overlay">
<div class="proposal-box">
<h2>Will You Be Mine Forever? 💖</h2>
<button onclick="finalYes()">YES ❤️</button>
</div>
</div>

<audio id="music" src="perfect.mp3.mpeg"></audio>

<script>

function sayYes() {
createFireworks();
document.getElementById("music").play();
}

function moveNo(btn) {
btn.style.position = "absolute";
btn.style.left = Math.random() * window.innerWidth + "px";
btn.style.top = Math.random() * window.innerHeight + "px";
}

function openRose() {
document.getElementById("roseGift").style.display = "block";
createHearts();
}

function openLetter() {
document.getElementById("loveLetter").style.display = "block";
typeLetter();
}

const letterText = `My Dearest Yoga ❤️

From the moment you walked into my life, everything changed.
You didn’t just become someone special —
you became my happiness, my peace, my favorite thought.

Every smile of yours makes my world brighter.
Every conversation with you feels like home.

I promise to value you, respect you,
and stand beside you through everything.

Forever yours,
Sathish ❤️`;

let index = 0;

function typeLetter() {
if (index < letterText.length) {
document.getElementById("typedText").innerHTML += letterText.charAt(index);
index++;
setTimeout(typeLetter, 35);
}
}

function openProposal() {
document.getElementById("proposalOverlay").style.display = "flex";
createHearts();
}

function finalYes() {
document.getElementById("proposalOverlay").innerHTML =
"<h1 style='color:white;'>She Said YESSSS ❤️💍</h1>";
createFireworks();
document.getElementById("music").play();
}

function createFireworks() {
for (let i = 0; i < 25; i++) {
let firework = document.createElement("div");
firework.className = "firework";
firework.style.left = Math.random() * window.innerWidth + "px";
firework.style.top = Math.random() * window.innerHeight + "px";
document.body.appendChild(firework);
setTimeout(() => firework.remove(), 1000);
}
}

function createHearts() {
for (let i = 0; i < 20; i++) {
let heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "💖";
heart.style.left = Math.random() * window.innerWidth + "px";
heart.style.bottom = "0px";
document.body.appendChild(heart);
setTimeout(() => heart.remove(), 4000);
}
}

</script>

</body>
</html>
