<!DOCTYPE html>
<html>
<head>
<title>Yoga ❤️ Sathish</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI, sans-serif;
text-align:center;
background:linear-gradient(135deg,#8B0000,#FF0000);
color:white;
overflow:hidden;
}

/* ENTRY */
#entry{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:20;
}

.name-intro{
font-size:60px;
letter-spacing:8px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{color:#ff4d4d;text-shadow:0 0 10px red;}
to{color:white;text-shadow:0 0 25px white;}
}

#entry button{
margin-top:30px;
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
cursor:pointer;
}

/* SLIDESHOW */
.slideshow{
position:relative;
margin-top:20px;
height:360px;
}

.slideshow img{
width:280px;
height:350px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
position:absolute;
left:50%;
transform:translateX(-50%);
opacity:0;
transition:opacity 1s;
}

.slideshow img.active{
opacity:1;
}

/* BUTTONS */
button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
margin:20px;
}

.yes{
background:white;
color:red;
font-weight:bold;
}

.no{
background:black;
color:white;
position:relative;
}

/* FLOATING HEARTS */
.heart{
position:absolute;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* LOVE LETTER */
#letter{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:red;
padding:30px;
border-radius:20px;
width:80%;
max-width:400px;
z-index:15;
}

/* RING */
#ring-container{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:120px;
animation:pop 1s ease forwards;
z-index:18;
}

@keyframes pop{
0%{transform:translate(-50%,-50%) scale(0);}
100%{transform:translate(-50%,-50%) scale(1);}
}

/* SIGNATURE */
.signature{
position:fixed;
bottom:20px;
width:100%;
font-size:28px;
font-family:cursive;
opacity:0;
animation:fadeIn 4s ease forwards;
animation-delay:3s;
}

@keyframes fadeIn{
to{opacity:1;}
}

/* FIREWORKS */
.firework{
position:fixed;
width:10px;
height:10px;
border-radius:50%;
background:white;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(8);opacity:0;}
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry">
<div class="name-intro">YOGA ❤️</div>
<h2>Sathish has something magical for you ✨</h2>
<button onclick="start()">Enter 💕</button>
</div>

<h1>You Are My Perfect ❤️</h1>
<h2 id="countdown"></h2>

<div class="slideshow">
<img src="photo1.jpg" class="active">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">
</div>

<h1>Will You Be My Valentine?</h1>

<button class="yes" onclick="yesClicked()">Yes 💖</button>
<button class="no" onclick="moveButton(this)">No 😜</button>

<audio id="music" src="perfect.mp3"></audio>

<div id="ring-container">💍</div>

<div id="letter">
<h2>My Dearest Yoga ❤️</h2>
<p>
You are my today and all of my tomorrows.
Will you stay with me forever? 💕
</p>
<button onclick="closeLetter()">Close 💌</button>
</div>

<div class="signature">Sathish ❤️ Yoga</div>

<script>

/* START */
function start(){
document.getElementById("entry").style.display="none";
document.getElementById("music").play();
}

/* SLIDESHOW */
let slides=document.querySelectorAll(".slideshow img");
let index=0;

setInterval(()=>{
slides[index].classList.remove("active");
index=(index+1)%slides.length;
slides[index].classList.add("active");
},3000);

/* YES CLICK */
function yesClicked(){
document.getElementById("ring-container").style.display="block";
launchFireworks();
setTimeout(()=>{
document.getElementById("letter").style.display="block";
},1000);
}

/* FIREWORKS */
function launchFireworks(){
for(let i=0;i<20;i++){
let fire=document.createElement("div");
fire.className="firework";
fire.style.left=Math.random()*100+"vw";
fire.style.top=Math.random()*100+"vh";
fire.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(fire);
setTimeout(()=>{fire.remove();},1000);
}
}

/* CLOSE LETTER */
function closeLetter(){
document.getElementById("letter").style.display="none";
}

/* MOVE NO BUTTON */
function moveButton(btn){
btn.style.position="absolute";
btn.style.top=Math.random()*window.innerHeight+"px";
btn.style.left=Math.random()*window.innerWidth+"px";
}

/* FLOATING HEARTS */
setInterval(()=>{
let heart=document.createElement("div");
heart.innerHTML="❤️";
heart.className="heart";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+15)+"px";
document.body.appendChild(heart);
setTimeout(()=>{heart.remove();},6000);
},500);

/* COUNTDOWN */
let target=new Date("Feb 14, 2026 00:00:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let distance=target-now;

let days=Math.floor(distance/(1000*60*60*24));
let hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

document.getElementById("countdown").innerHTML=
"Countdown to Our Special Day ❤️: "+days+" Days "+hours+" Hours";
},1000);

</script>

</body>
</html>
