<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #ff4d6d, #c9184a);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    color: white;
    overflow-x: hidden;
}

/* Name Intro Animation */
.intro {
    font-size: 50px;
    margin-top: 60px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 30px yellow; }
}

button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #c9184a;
    cursor: pointer;
    margin-top: 30px;
}

.gallery {
    margin-top: 40px;
}

.gallery img {
    width: 250px;
    height: 300px;
    object-fit: cover;
    margin: 10px;
    border-radius: 20px;
    box-shadow: 0 0 20px white;
    transition: transform 0.5s;
}

.gallery img:hover {
    transform: scale(1.1);
}

/* Fireworks */
.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    background: yellow;
    border-radius: 50%;
    animation: explode 1s ease-out infinite;
}

@keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(15); opacity: 0; }
}

/* Signature */
.signature {
    margin-top: 50px;
    font-size: 28px;
    font-family: cursive;
    border-right: 3px solid white;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 4s steps(20) forwards, blink 0.7s infinite;
}

@keyframes typing {
    from { width: 0; }
    to { width: 220px; }
}

@keyframes blink {
    50% { border-color: transparent; }
}

</style>
</head>

<body>

<h1 class="intro">Yoga ❤️</h1>

<button onclick="startLove()">Will You Be My Valentine?</button>

<div class="gallery">
    <img src="photo1.jpg.jpeg">
    <img src="photo2.jpg.jpeg">
    <img src="photo3.jpg.jpeg">
    <img src="photo4.jpg.jpeg">
    <img src="photo5.jpg.jpeg">
    <img src="photo6.jpg.jpeg">
</div>

<div class="signature">With Love, Sathish ❤️</div>

<audio id="music" src="perfect.mp3.mpeg"></audio>

<script>
function startLove() {
    document.getElementById("music").play();
    createFireworks();
}

function createFireworks() {
    for (let i = 0; i < 20; i++) {
        let firework = document.createElement("div");
        firework.className = "firework";
        firework.style.left = Math.random() * window.innerWidth + "px";
        firework.style.top = Math.random() * window.innerHeight + "px";
        document.body.appendChild(firework);

        setTimeout(() => {
            firework.remove();
        }, 1000);
    }
}
</script>

</body>
</html>
