<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For My Love ❤️</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
}

/* Slide container */
.slide{
    position:fixed;
    top:0;
    left:100%;
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:25px;
    box-sizing:border-box;

    transition:left 0.8s ease-in-out;
}

.slide.active{
    left:0;
}

h1{
    font-size:30px;
    color:white;
    margin-bottom:10px;
}

h2{
    font-size:24px;
    color:white;
}

p{
    font-size:18px;
    color:white;
    max-width:420px;
}

button{
    margin-top:25px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4e7a;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- Slide 1 -->
<div class="slide active" id="slide1">
    <h1>Hi My Love ❤️</h1>
    <p>I made something special just for you.</p>
    <button onclick="showSlide('slide2')">Next ➡</button>
</div>

<!-- Slide 2 -->
<div class="slide" id="slide2">
    <h2>You Are My Happiness 🌸</h2>
    <p>Every moment with you feels magical and beautiful.</p>
    <button onclick="showSlide('slide3')">Next ➡</button>
</div>

<!-- Slide 3 -->
<div class="slide" id="slide3">
    <h2>I Love You Forever 💕</h2>
    <p>You mean everything to me.</p>
</div>

<!-- Background Music -->
<audio id="music" src="perfect.mp3.mpeg" preload="auto"></audio>

<script>
function showSlide(id){
    document.querySelectorAll(".slide").forEach(slide=>{
        slide.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

/* Play music on first tap (mobile safe) */
document.addEventListener("click", function(){
    const music = document.getElementById("music");
    music.play().catch(()=>{});
}, { once:true });
</script>

</body>
</html>
